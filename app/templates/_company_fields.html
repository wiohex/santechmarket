<label>
  Название магазина / компании<input name="name"
       value="{{ company.name if company else '' }}"
       minlength="2"
       maxlength="200"
       autocomplete="organization"
       required></label><label>ИНН<input name="inn"
       value="{{ company.inn if company else '' }}"
       inputmode="numeric"
       pattern="[0-9]{10}|[0-9]{12}"
       minlength="10"
       maxlength="12"
       required></label><label>Контактное лицо<input name="contact"
       value="{{ company.contact if company else '' }}"
       minlength="2"
       maxlength="100"
       autocomplete="name"
       required></label><label>Телефон<input name="phone"
       value="{{ company.phone if company else '' }}"
       type="tel"
       minlength="10"
       maxlength="24"
       autocomplete="tel"
       required>
  </label>
