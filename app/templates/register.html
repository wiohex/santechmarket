{% extends "base.html" %}
{% block content %}
  <section class="container section narrow">
    <div class="eyebrow">ДЛЯ МАГАЗИНОВ САНТЕХНИКИ</div>
    <h1>Кабинет вашего магазина</h1>
    <p class="muted">История, статусы и повтор заявок — всё в одном месте.</p>
    <form class="panel form-stack" method="post">
      {% include "_csrf.html" %}
      {% set company = none %}
      {% include "_company_fields.html" %}
      <label>
        Email<input name="email"
       type="email"
       maxlength="254"
       autocomplete="username"
       required></label><label>Пароль<input name="password"
       type="password"
       minlength="10"
       maxlength="128"
       autocomplete="new-password"
       required><small class="muted">От 10 до 128 символов.</small></label><button>Создать кабинет</button><a class="text-link" href="/login">Уже есть кабинет? Войти →</a>
    </form>
  </section>
{% endblock %}
